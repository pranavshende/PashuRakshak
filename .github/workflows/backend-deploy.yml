name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/**'

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Install Dependencies
        run: npm ci

      - name: Run Prisma Generate
        run: npx prisma generate

      - name: Restart Node Server via SSH
        # Note: Replace with actual server deployment step
        run: echo "Deploying Node.js API to production server"
